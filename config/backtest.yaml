mode: backtest

account:
  account_id: backtest-account
  initial_cash: 100000

data:
  provider: local
  source: alpaca
  root: data/market
  timeframe: 1m
  adjusted: true
  adjustment_type: all

universe:
  symbols: [SPY]

strategies:
  strategy_id: ma-cross-example
  symbol: SPY
  fast_window: 10
  slow_window: 20
  target_notional: 1000

portfolio:
  default_notional: 1000

broker:
  type: backtest

execution:
  default_order_type: market
  default_time_in_force: day

backtest:
  start_date: "2026-05-19"
  end_date: "2026-05-20"
  bar_timestamp_policy: bar_end
  signal_timing_policy: on_bar_close
  order_activation_policy: next_event
  allow_same_event_fill: false

risk:
  max_order_notional: 5000
  max_symbol_exposure_pct: 0.10
  max_gross_exposure_pct: 1.00
  daily_loss_limit_pct: 0.02
